repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        exclude: docs/mkdocs.yml
      - id: debug-statements
      - id: mixed-line-ending

  - repo: https://github.com/abravalheri/validate-pyproject
    rev: 17e12779811926f000bdfa1795f9e3735dd71ac3  # frozen: 0.26
    hooks:
      - id: validate-pyproject
        # The package lives in py/, not at the repo root
        files: 'pyproject\.toml$'
        additional_dependencies: ["validate-pyproject-schema-store[all]"]

  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0494aa7fa1314e98913a41227d8f0a515b2c1049  # frozen: 0.38.2
    hooks:
      - id: check-dependabot
      - id: check-github-workflows

  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: '321478e58f4938179c6b86e4ddfa923d1547a49b'  # frozen: v0.16.6
    hooks:
      - id: ruff-format
      - id: ruff-check
        args: ["--fix", "--show-fixes"]

  - repo: https://github.com/rhysd/actionlint
    rev: 914e7df21a07ef503a81201c76d2b11c789d3fca  # frozen: v1.7.12
    hooks:
      - id: actionlint
        files: ".github/workflows/"
        args: ["-ignore", "SC1090", "-ignore", "SC2046", "-ignore", "SC2086", "-ignore", "SC2129", "-ignore", "SC2155"]

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: fa412071e4f5d44d44f9e365f4676f9df92456a2  # frozen: v1.30.1
    hooks:
      - id: zizmor
        files: "^\\.github"
        exclude: ".github/release.yml"
        args: [--persona=pedantic]

  - repo: https://github.com/codespell-project/codespell
    # Configuration for codespell is in .codespellrc
    rev: 57b21406f092110c18776e39b0bda50d37c945c8  # frozen: v2.4.3
    hooks:
      - id: codespell

  - repo: local
    hooks:
      - id: rustfmt
        name: rustfmt
        description: Check if all files follow the rustfmt style
        entry: cargo fmt --all -- --color always
        language: system
        pass_filenames: false
      - id: clippy
        name: clippy
        description: Run Cargo Clippy
        entry: cargo clippy
        language: system
        pass_filenames: false
      - id: duplicate-common-variable-names
        name: duplicate-common-variable-names
        description: Check for duplicate common variable names in standards
        entry: uv run --script utils/error_on_duplicate_variables.py
        language: system
        pass_filenames: false
        files: ^core/standards/.*\.yaml$

  - repo: https://github.com/adamchainz/blacken-docs
    rev: "fda77690955e9b63c6687d8806bafd56a526e45f"  # frozen: 1.20.0
    hooks:
      - id: blacken-docs
        additional_dependencies: [black==26.*]

  - repo: https://github.com/hukkin/mdformat
    rev: 82912cdaea4fb830f751504486a7879c70526547  # frozen: 1.0.0
    hooks:
    - id: mdformat

  - repo: https://github.com/biomejs/pre-commit
    rev: "922fba1f8fd9f9f096d04586e54369a31e6c1c31"  # frozen: v2.5.12
    hooks:
    -   id: biome-check
        additional_dependencies: ["@biomejs/biome@2.5.12"]

  - repo: https://github.com/scientific-python/cookie
    rev: "2026.08.14" # frozen: 2026.08.14
    hooks:
      - id: sp-repo-review
        name: repo-review (root)
        entry: repo-review --ignore PY001,PY004,PY005,PP301,GH212,PC140,PC170
      - id: sp-repo-review
        name: repo-review (py)
        entry: repo-review py

  - repo: https://github.com/renovatebot/pre-commit-hooks
    rev: 885e2710422a2e5358d713de0edc457d483e7f3f  # frozen: 44.115.5
    hooks:
      - id: renovate-config-validator
        args: [--strict]

update:
  cooldown_days: 7
  freeze: true
