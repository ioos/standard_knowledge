qc:
  glos:
    name: GLOS Seagull
    summary: QARTOD tests that GLOS uses for Seagull data
    description: QARTOD tests that GLOS uses for water temperature data on Seagull.
    tests:
      qartod:
        # flat_line_test:
        #   fail_threshold: 4
        #   suspect_threshold: 2
        #   tolerance: 0.1
        gross_range_test:
          fail_span:
          - 268.15
          - 323.15
          suspect_span:
          - 273.15
          - 308.15
        rate_of_change_test:
          threshold: 1.5
        spike_test:
          fail_threshold: 2
          suspect_threshold: 1
  qartod_manual:
    name: QARTOD Temperature and Salinity manual
    summary: QARTOD temperature and salinity tests with thresholds derived from statistics of your own data
    description: |
      Tests from the IOOS QARTOD Manual for Real-Time Quality Control of In-situ Temperature and Salinity Data, Update 2 (2020), with thresholds derived from
      statistics of a historical record at the site, as the manual
      recommends instead of choosing them arbitrarily.

      - Gross range: fail at the sensor limits (SENSOR_MIN, SENSOR_MAX).
        Suspect outside `mean ± k × std` of the record.
      - Rate of change: `n_dev × SD` over TIM_DEV (25 hours) between
        consecutive observations, converted to degrees C per second for ioos_qc.
      - Flat line: values within EPS for REP_CNT observations.
      - Attenuated signal: suspect and fail below MIN_VAR_WARN and
        MIN_VAR_FAIL, the standard deviation over TST_TIM.

      Defaults are the manual's examples or common choices. Check them
      against local conditions.
    arguments:
      sensor_min:
        type: float
        description: Lowest value the sensor can measure, in degrees C (SENSOR_MIN)
        required: true
      sensor_max:
        type: float
        description: Highest value the sensor can measure, in degrees C (SENSOR_MAX)
        required: true
      mean:
        type: float
        description: Mean of a historical record at the site, in degrees C
        required: true
      std:
        type: float
        description: Standard deviation of the historical record, in degrees C
        required: true
      k:
        type: float
        description: Standard deviations from the mean for the suspect span
        default: 3
      sd:
        type: float
        description: Standard deviation over the previous 25 hours (SD over TIM_DEV), in degrees C
        required: true
      n_dev:
        type: float
        description: Number of standard deviations allowed between observations (N_DEV)
        default: 3
      sample_interval:
        type: int
        description: Seconds between observations
        required: true
      eps:
        type: float
        description: Largest change, in degrees C, still counted as a repeat (EPS)
        default: 0.05
      rep_cnt_suspect:
        type: int
        description: Repeated observations before a flat line is suspect (REP_CNT_SUSPECT)
        default: 3
      rep_cnt_fail:
        type: int
        description: Repeated observations before a flat line fails (REP_CNT_FAIL)
        default: 5
      min_var_warn:
        type: float
        description: Standard deviation over TST_TIM below which data is suspect, in degrees C (MIN_VAR_WARN)
        required: true
      min_var_fail:
        type: float
        description: Standard deviation over TST_TIM below which data fails, in degrees C (MIN_VAR_FAIL)
        required: true
      tst_tim:
        type: float
        description: Hours over which to measure the standard deviation (TST_TIM)
        default: 12
    let:
      hour: 3600
    tests:
      qartod:
        gross_range_test:
          fail_span: [{expr: "sensor_min"}, {expr: "sensor_max"}]
          suspect_span: [{expr: "mean - k * std"}, {expr: "mean + k * std"}]
        rate_of_change_test:
          threshold: {expr: "n_dev * sd / sample_interval"}
        flat_line_test:
          tolerance: {expr: "eps"}
          suspect_threshold: {expr: "rep_cnt_suspect * sample_interval"}
          fail_threshold: {expr: "rep_cnt_fail * sample_interval"}
        attenuated_signal_test:
          suspect_threshold: {expr: "min_var_warn"}
          fail_threshold: {expr: "min_var_fail"}
          test_period: {expr: "tst_tim * hour"}
          check_type: std
