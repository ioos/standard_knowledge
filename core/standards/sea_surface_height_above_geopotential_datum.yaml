standard_name: sea_surface_height_above_geopotential_datum
ioos_category: Sea Level
long_name: Sea surface height above geopotential datum
sibling_standards:
- tidal_sea_surface_height_above_mean_lower_low_water
- tidal_sea_surface_height_above_mean_higher_high_water
common_variable_names:
- navd88
- navd88_meters
- navd_meters
- water_level_od_malin
- water_level_lat
- mllw_meters
- mhhw_meters
qc:
  gulf_of_maine:
    name: Gulf of Maine
    summary: Water level tests for stations in the Gulf of Maine developed by Hannah Baranes
    # The leading blank line keeps the description identical to the Rust
    # version this replaced.
    description: |

      ### Gross range test configuration for Gulf of Maine (not New England Shelf)

      #### Suspect Limits

      For stations with tidal datums (might not want this approach because it will always take a while to get tidal datums, and tidal datums change):
      - Upper limit of range: MHHW + 6 ft
      - Lower limit of range: MLLW – 4.5 ft



      For stations without tidal datums:
      - If there are no tidal datums because the station was just installed: use VDatum to get MHHW and MLLW relative to navd88_meters at a point close to the sensor, and use the same upper and lower limits
          - Note: if it’s a station with river influence (like Bath), it might require some local expertise to set the limits. A solid approach is just taking the HW and LW measured over the course of the first week, and using something like HW + 10 ft and LW – 10 ft to be conservative
      - If there are no tidal datums because the sensor bottoms out at low tide:
          - Lower limit: Use the dry bottom elevation
          - Upper limit: Use VDatum MHHW + 6 ft


      #### Fail upper and lower limits
      - Upper limit: distance to water is less than whatever the minimum sensing range is
      - Lower limit: either hard bottom (if it’s a site that bottoms out at LW, or if we have a depth measurement at the site), or distance to water = maximum of sensing range

      #### Notes

      Top recorded water levels, in ft MHHW (and year)
      - Gulf of Maine
          - Eastport: 5.07 (2020)
          - Bar Harbor: 4.43 (2024)
          - Portland: 4.67 (2024)
          - Boston: 4.89 (2018)
      - New England Shelf
          - Chatham, MA: 4.28 (2014)
          - Newport, RI: 9.45 (1938)
          -New London, CT: 7.53 (1938)

      Lowest navd88_meters
      - Eastport: -3.46 ft MLLW  (this will have the largest variability)

      ### Rate of change test. Input as a rate.

      - Suspect: 0.75 feet per 6 minutes
      - Fail: 1 foot per 6 minutes

      Rationale: max rate of change from tides in Eastport is 5.3 ft per hour (midtide on 1/13/2024), or ~0.5 ft per 6 minutes. Add 0.25 feet for a sustained wind-driven increase in water level.

      May want to adjust this so it’s dependent on tidal range

      ### Spike test: Input as a magnitude that’s checked across a measurement and the two adjacent measurements.

      Maybe default to same as rate of change test?

      ### Flat line test: If there’s some lack of variance over some amount of time, mark as suspect/fail

      Suspect/Fail = how long do subsequent values stay within that threshold before it’s considered flat? (input as a time)

      For example, if all measurements over the past 4 hours are within 10 cm of each other, fail the flatline test (then tolerance = 10 cm, and time = 4 hours)

      When a sensor flatlines, the system voltage and temperature sensor may still be causing variation

      Let’s start with 0.1 feet over 2 hours for suspect, and 0.1 feet over 3 hours for fail.

      Rationale: During neap tides in Portland, you could see as little as +/- 0.25 ft per hour of variation in the 2 hours around slack tide (HW or LW)
    arguments:
      mllw:
        type: float
        description: Mean lower low water elevation in NAVD 88 meters
        required: true
      mhhw:
        type: float
        description: Mean higher high water elevation in NAVD 88 meters
        required: true
    let:
      ft: 0.3048
      hour: 3600
    tests:
      qartod:
        gross_range_test:
          suspect_span: [{expr: "mllw - 4.5 * ft"}, {expr: "mhhw + 6.0 * ft"}]
          fail_span: [{expr: "mllw - 4.5 * ft"}, {expr: "mhhw + 6.0 * ft"}]
        spike_test:
          suspect_threshold: {expr: "0.75 * ft"}
          fail_threshold: {expr: "1.5 * ft"}
        # ioos_qc expects units per second. This keeps the value of the Rust
        # version (0.75 ft) rather than 0.75 ft per 6 minutes.
        rate_of_change_test:
          threshold: {expr: "0.75 * ft"}
        flat_line_test:
          tolerance: {expr: "0.1 * ft"}
          suspect_threshold: {expr: "2 * hour"}
          fail_threshold: {expr: "3 * hour"}
  long_island_sound:
    name: Long Island Sound
    summary: Water level tests for stations in Long Island Sound
    description: Water level tests for Long Island Sound by Anna
    arguments:
      mllw:
        type: float
        description: Mean lower low water elevation in NAVD 88 meters
        required: true
    # The tests haven't been written yet
    tests:
      qartod: {}
  qartod_manual:
    name: QARTOD Water Level manual
    summary: QARTOD water level tests with thresholds derived from statistics of your own data
    description: |
      Tests from the IOOS QARTOD Manual for Real-Time Quality Control of Water Level Data, Version 2.1 (2021), with thresholds derived from
      statistics of a historical record at the site, as the manual
      recommends instead of choosing them arbitrarily.

      - Gross range: fail at the sensor limits (SENSOR_MIN, SENSOR_MAX).
        Suspect outside `mean ± k × std` of the record.
      - Rate of change: `n_dev × SD` over TIM_DEV (25 hours) between
        consecutive observations, converted to m per second for ioos_qc.
      - Flat line: values within EPS for REP_CNT observations.
      - Attenuated signal: suspect and fail below MIN_VAR_WARN and
        MIN_VAR_FAIL, the standard deviation over TST_TIM.

      Defaults are the manual's examples or common choices. Check them
      against local conditions.
    arguments:
      sensor_min:
        type: float
        description: Lowest value the sensor can measure, in m (SENSOR_MIN)
        required: true
      sensor_max:
        type: float
        description: Highest value the sensor can measure, in m (SENSOR_MAX)
        required: true
      mean:
        type: float
        description: Mean of a historical record at the site, in m
        required: true
      std:
        type: float
        description: Standard deviation of the historical record, in m
        required: true
      k:
        type: float
        description: Standard deviations from the mean for the suspect span
        default: 3
      sd:
        type: float
        description: Standard deviation over the previous 25 hours (SD over TIM_DEV), in m
        required: true
      n_dev:
        type: float
        description: Number of standard deviations allowed between observations (N_DEV)
        default: 3
      sample_interval:
        type: int
        description: Seconds between observations
        required: true
      eps:
        type: float
        description: Largest change, in m, still counted as a repeat (EPS)
        default: 0.001
      rep_cnt_suspect:
        type: int
        description: Repeated observations before a flat line is suspect (REP_CNT_SUSPECT)
        default: 3
      rep_cnt_fail:
        type: int
        description: Repeated observations before a flat line fails (REP_CNT_FAIL)
        default: 5
      min_var_warn:
        type: float
        description: Standard deviation over TST_TIM below which data is suspect, in m (MIN_VAR_WARN)
        required: true
      min_var_fail:
        type: float
        description: Standard deviation over TST_TIM below which data fails, in m (MIN_VAR_FAIL)
        required: true
      tst_tim:
        type: float
        description: Hours over which to measure the standard deviation (TST_TIM)
        default: 12
    let:
      hour: 3600
    tests:
      qartod:
        gross_range_test:
          fail_span: [{expr: "sensor_min"}, {expr: "sensor_max"}]
          suspect_span: [{expr: "mean - k * std"}, {expr: "mean + k * std"}]
        rate_of_change_test:
          threshold: {expr: "n_dev * sd / sample_interval"}
        flat_line_test:
          tolerance: {expr: "eps"}
          suspect_threshold: {expr: "rep_cnt_suspect * sample_interval"}
          fail_threshold: {expr: "rep_cnt_fail * sample_interval"}
        attenuated_signal_test:
          suspect_threshold: {expr: "min_var_warn"}
          fail_threshold: {expr: "min_var_fail"}
          test_period: {expr: "tst_tim * hour"}
          check_type: std
