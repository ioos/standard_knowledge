[tools]
node = "26.11.1"
python = "3.14.8"
# 1.96.0 satisfies the workspace MSRV (1.85) and matches RUSTUP_TOOLCHAIN in
# [tool.cibuildwheel.pyodide] (py/pyproject.toml), so one toolchain covers
# native, wasm32-unknown-unknown, and pyodide builds.
rust = { version = "1.99.0", components = "rustfmt,clippy", targets = "wasm32-unknown-unknown,wasm32-unknown-emscripten" }
uv = "0.13.1"
"github:wasm-bindgen/wasm-pack" = "0.15.0"
prek = "0.5.5"
